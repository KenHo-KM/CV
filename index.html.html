<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>學徒履歷</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px 40px;
    }

    h1 {
      margin-bottom: 4px;
      font-size: 28px;
    }

    .intro {
      margin-top: 0;
      color: #64748b;
    }

    .notice {
      padding: 12px 16px;
      margin: 20px 0;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 21px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .grid .field {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: #1e293b;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    .item {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .item-title {
      font-weight: bold;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      font: inherit;
      font-weight: bold;
    }

    .add-button {
      color: #1d4ed8;
      background: #dbeafe;
    }

    .remove-button {
      color: #b91c1c;
      background: #fee2e2;
      padding: 6px 12px;
      font-size: 14px;
    }

    .print-button {
      width: 100%;
      color: #fff;
      background: #1d4ed8;
      padding: 14px;
      font-size: 17px;
    }

    button:hover {
      filter: brightness(0.96);
    }

    #print-view {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }
    }

    @page {
      size: A4;
      margin: 15mm;
    }

    @media print {
      body {
        background: #fff;
        color: #000;
        font-size: 11pt;
      }

      #app {
        display: none;
      }

      #print-view {
        display: block;
      }

      #print-view h1 {
        margin: 0 0 14px;
        font-size: 22pt;
      }

      #print-view h2 {
        margin: 18px 0 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid #888;
        font-size: 14pt;
        break-after: avoid;
        page-break-after: avoid;
      }

      .print-line {
        margin: 4px 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .print-item {
        margin: 0 0 12px;
        break-inside: avoid;
        page-break-inside: avoid;
      }
.print-item-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-bottom: 4px;
}

.print-item-heading .left {
  font-weight: bold;
  overflow-wrap: anywhere;
}

.print-item-heading .right {
  margin-left: auto;
  text-align: right;
}
.print-header {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  align-items: start;
  margin-bottom: 14px;
}

#print-view .print-header h1 {
  margin: 0;
  overflow-wrap: anywhere;
}

.print-address {
  text-align: right;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

    }
.address-field {
  grid-column: 1 / -1;
}
/* 產生 PDF 時暫時顯示的畫面 */
.pdf-overlay {
  position: fixed;
  top: 0;
  left: -10000px;
  width: 190mm;
  background: #fff;
}

/* PDF 內容版面 */
#pdf-export {
  width: 190mm;
  padding: 0;
  background: #fff;
  color: #000;
  font-size: 11pt;
  line-height: 1.6;
}

#pdf-export h1 {
  margin: 0;
  font-size: 22pt;
  overflow-wrap: anywhere;
}

#pdf-export h2 {
  margin: 18px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #888;
  font-size: 14pt;
  break-after: avoid;
}

#pdf-export .print-header {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  align-items: start;
  margin-bottom: 14px;
}

#pdf-export .print-address {
  text-align: right;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#pdf-export .print-line {
  margin: 4px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#pdf-export .print-item {
  margin: 0 0 12px;
  break-inside: avoid;
}

#pdf-export .print-item-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-bottom: 4px;
}

#pdf-export .print-item-heading .left {
  font-weight: bold;
  overflow-wrap: anywhere;
}

#pdf-export .print-item-heading .right {
  margin-left: auto;
  text-align: right;
}
  </style>
</head>

<body>
  <main id="app" class="container">
    <h1>學徒履歷表</h1>
    <p class="intro">填寫資料後，可列印或儲存為 PDF。</p>

    <div class="notice">
      注意：資料只保留在目前頁面，不會自動儲存。
      重新整理或關閉頁面前，請先匯出 PDF。
    </div>

    <section class="card">
      <h2>基本資料</h2>

      <div class="grid">
        <div class="field">
          <label for="name">姓名</label>
          <input id="name" type="text" autocomplete="name">
        </div>

        <div class="field">
          <label for="birthday">出生日期</label>
          <input id="birthday" type="text" placeholder="例如：2000／01／31">
        </div>

        <div class="field">
          <label for="phone">電話</label>
          <input id="phone" type="tel" autocomplete="tel">
        </div>

        <div class="field">
          <label for="email">電郵</label>
          <input id="email" type="email" autocomplete="email">
        </div>
<div class="field address-field">
  <label for="address-building">地址</label>
  <input
    id="address-building"
    type="text"
    autocomplete="address-line1"
    placeholder="地區及街道名稱，例如：九龍長沙灣長裕街10號"
  >
</div>

<div class="field address-field">
  <label for="address-district"></label>
  <input
    id="address-district"
    type="text"
    autocomplete="address-line2"
    placeholder="建築物名稱、樓層及單位，例如：XX大廈10樓A室"
  >
</div>
      </div>
    </section>

    <section class="card">
      <h2>自我介紹</h2>

      <div class="field">
        <label for="introduction">個人簡介</label>
        <textarea
          id="introduction"
          placeholder="請簡述您的學習背景、個人特點及求職目標。"
        ></textarea>
      </div>
    </section>

    <section class="card">
      <h2>學歷</h2>
      <div id="education-list"></div>
      <button class="add-button" type="button" data-add="education">
        ＋ 新增學歷
      </button>
    </section>

    <section class="card">
      <h2>工作經驗</h2>
      <div id="work-list"></div>
      <button class="add-button" type="button" data-add="work">
        ＋ 新增工作經驗
      </button>
    </section>

    <section class="card">
      <h2>技能</h2>
      <div id="skill-list"></div>
      <button class="add-button" type="button" data-add="skill">
        ＋ 新增技能
      </button>
    </section>

<button id="print-button" class="print-button" type="button">
  下載 PDF
</button>
  </main>

  <!-- 列印時顯示的履歷內容 -->
  <main id="print-view"></main>

  <script>
    const definitions = {
      education: {
        title: "學歷",
        listId: "education-list",
        fields: [
          { key: "school", label: "學校", type: "text" },
          { key: "course", label: "課程／科目", type: "text" },
          {
            key: "date",
            label: "就讀日期",
            type: "text",
            placeholder: "例如：2020／09 至 2023／06"
          }
        ]
      },

      work: {
        title: "工作經驗",
        listId: "work-list",
        fields: [
          { key: "company", label: "公司", type: "text" },
          { key: "position", label: "職位", type: "text" },
          {
            key: "date",
            label: "工作日期",
            type: "text",
            placeholder: "例如：2023／07 至 2024／12"
          },
          { key: "details", label: "工作內容", type: "textarea" }
        ]
      },

      skill: {
        title: "技能",
        listId: "skill-list",
        fields: [
          { key: "name", label: "技能名稱", type: "text" },
          {
            key: "description",
            label: "程度／說明",
            type: "textarea",
            placeholder: "例如：熟悉基本工具操作"
          }
        ]
      }
    };

    let nextId = 0;

    function updateNumbers(group) {
      const definition = definitions[group];
      const list = document.getElementById(definition.listId);

      list.querySelectorAll(".item").forEach((item, index) => {
        item.querySelector(".item-title").textContent =
          definition.title + " " + (index + 1);
      });
    }

    function addItem(group) {
      const definition = definitions[group];
      const list = document.getElementById(definition.listId);
      const item = document.createElement("div");

      item.className = "item";

      const header = document.createElement("div");
      header.className = "item-header";

      const title = document.createElement("span");
      title.className = "item-title";

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "remove-button";
      removeButton.textContent = "刪除";

      removeButton.addEventListener("click", () => {
        item.remove();
        updateNumbers(group);
      });

      header.append(title, removeButton);
      item.appendChild(header);

      definition.fields.forEach((field) => {
        const wrapper = document.createElement("div");
        wrapper.className = "field";

        const id = "field-" + (++nextId);

        const label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = field.label;

        const input = document.createElement(
          field.type === "textarea" ? "textarea" : "input"
        );

        input.id = id;
        input.dataset.key = field.key;

        if (field.type !== "textarea") {
          input.type = field.type;
        }

        if (field.placeholder) {
          input.placeholder = field.placeholder;
        }

        wrapper.append(label, input);
        item.appendChild(wrapper);
      });

      list.appendChild(item);
      updateNumbers(group);
    }

    document.querySelectorAll("[data-add]").forEach((button) => {
      button.addEventListener("click", () => {
        addItem(button.dataset.add);
      });
    });

    function addPrintHeading(parent, text, level) {
      const heading = document.createElement(level);
      heading.textContent = text;
      parent.appendChild(heading);
    }

    function addPrintLine(parent, label, value) {
      const line = document.createElement("p");
      line.className = "print-line";

      if (label) {
        const strong = document.createElement("strong");
        strong.textContent = label + "：";
        line.appendChild(strong);
      }

      line.appendChild(document.createTextNode(value));
      parent.appendChild(line);
    }

function addPrintGroup(view, group) {
  const definition = definitions[group];
  const list = document.getElementById(definition.listId);
  const completedItems = [];

  list.querySelectorAll(".item").forEach((item) => {
    const values = {};

    definition.fields.forEach((field) => {
      const input = item.querySelector(
        '[data-key="' + field.key + '"]'
      );

      values[field.key] = input.value.trim();
    });

    const hasContent = Object.values(values).some(
      (value) => value !== ""
    );

    if (hasContent) {
      completedItems.push(values);
    }
  });

  // 沒有填寫的類別不顯示在 PDF 中。
  if (completedItems.length === 0) return;

  addPrintHeading(view, definition.title, "h2");

  completedItems.forEach((values) => {
    const item = document.createElement("div");
    item.className = "print-item";

    if (group === "education") {
      // 學校獨立顯示一行。
      if (values.school) {
        addPrintLine(item, "", values.school);
      }

      // 課程靠左，就讀日期靠右。
      const heading = document.createElement("div");
      heading.className = "print-item-heading";

      const left = document.createElement("span");
      left.className = "left";
      left.textContent = values.course || "";

      const right = document.createElement("span");
      right.className = "right";
      right.textContent = values.date || "";

      heading.append(left, right);
      item.appendChild(heading);

    } else if (group === "work") {
      // 職位靠左，工作日期靠右。
      const heading = document.createElement("div");
      heading.className = "print-item-heading";

      const left = document.createElement("span");
      left.className = "left";
      left.textContent = values.position || "";

      const right = document.createElement("span");
      right.className = "right";
      right.textContent = values.date || "";

      heading.append(left, right);
      item.appendChild(heading);

      if (values.company) {
        addPrintLine(item, "公司", values.company);
      }

      if (values.details) {
        addPrintLine(item, "工作內容", values.details);
      }

    } else if (group === "skill") {
      if (values.name) {
        addPrintLine(item, "技能", values.name);
      }

      if (values.description) {
        addPrintLine(item, "程度／說明", values.description);
      }
    }

    view.appendChild(item);
  });
}
function buildPrintView() {
  const view = document.getElementById("print-view");
  view.replaceChildren();

  // 姓名顯示在最頂端；未填寫時顯示預設標題。
const name = document.getElementById("name").value.trim();
const address = [
  document.getElementById("address-building").value.trim(),
  document.getElementById("address-district").value.trim()
].filter(Boolean).join("\n");

// 姓名在左，地址在右。
const header = document.createElement("div");
header.className = "print-header";

const nameHeading = document.createElement("h1");
nameHeading.textContent = name || "學徒履歷表";

const addressBlock = document.createElement("div");
addressBlock.className = "print-address";
addressBlock.textContent = address;

header.append(nameHeading, addressBlock);
view.appendChild(header);

  const basicFields = [
    ["出生日期", "birthday"],
    ["電話", "phone"],
    ["電郵", "email"]
  ];

  const filledBasicFields = basicFields
    .map(([label, id]) => ({
      label: label,
      value: document.getElementById(id).value.trim()
    }))
    .filter((field) => field.value !== "");

  if (filledBasicFields.length > 0) {
    addPrintHeading(view, "基本資料", "h2");

    filledBasicFields.forEach((field) => {
      addPrintLine(view, field.label, field.value);
    });
  }

  const introduction = document
    .getElementById("introduction")
    .value.trim();

  if (introduction) {
    addPrintHeading(view, "自我介紹", "h2");
    addPrintLine(view, "", introduction);
  }

  addPrintGroup(view, "education");
  addPrintGroup(view, "work");
  addPrintGroup(view, "skill");
}

document.getElementById("print-button").addEventListener("click", async () => {
  if (
    typeof html2canvas === "undefined" ||
    typeof window.jspdf === "undefined"
  ) {
    alert("無法載入 PDF 工具。請檢查網絡連線，然後重新開啟頁面。");
    return;
  }

  const button = document.getElementById("print-button");
  const originalText = button.textContent;
  let stage = null;

  button.disabled = true;
  button.textContent = "正在產生 PDF，請稍候…";

  try {
    // 根據表單內容，建立現有的履歷版面。
    buildPrintView();

    const printView = document.getElementById("print-view");

    // 清除之前測試時留在頁面上的預覽。
    const oldPreview = document.getElementById("pdf-export");
    if (oldPreview) oldPreview.remove();

    // 暫時在畫面上建立 PDF 內容。
    stage = document.createElement("div");
    stage.style.cssText = [
      "position: fixed",
      "top: 0",
      "left: 0",
      "width: 100vw",
      "height: 100vh",
      "overflow: auto",
      "z-index: 2147483647",
      "background: white"
    ].join(";");

    const exportView = document.createElement("main");
    exportView.id = "pdf-export";
    exportView.innerHTML = printView.innerHTML;

    stage.appendChild(exportView);
    document.body.appendChild(stage);

    // 等待版面及字型準備好。
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    await new Promise((resolve) => {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    });

    // 把履歷內容轉為圖片。
    const canvas = await html2canvas(exportView, {
      scale: 1.5,
      backgroundColor: "#ffffff",
      windowWidth: 1024,
      scrollX: 0,
      scrollY: 0
    });

    if (!canvas.width || !canvas.height) {
      throw new Error("產生的履歷圖片沒有尺寸。");
    }

    // 建立 A4 PDF。
    const jsPDF = window.jspdf.jsPDF;
    const pdf = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: "a4"
    });

    const margin = 10;
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const contentWidth = pageWidth - margin * 2;
    const contentHeight = pageHeight - margin * 2;

    // 按 A4 可用高度切分圖片。
    const pixelsPerPage = Math.max(
      1,
      Math.floor(canvas.width * contentHeight / contentWidth)
    );

    let sourceY = 0;
    let pageNumber = 0;

    while (sourceY < canvas.height) {
      const sliceHeight = Math.min(
        pixelsPerPage,
        canvas.height - sourceY
      );

      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeight;

      const context = pageCanvas.getContext("2d");
      if (!context) {
        throw new Error("無法建立 PDF 頁面圖片。");
      }

      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, pageCanvas.width, pageCanvas.height);

      context.drawImage(
        canvas,
        0, sourceY, canvas.width, sliceHeight,
        0, 0, canvas.width, sliceHeight
      );

      if (pageNumber > 0) {
        pdf.addPage();
      }

      const imageHeight = sliceHeight * contentWidth / canvas.width;

      pdf.addImage(
        pageCanvas.toDataURL("image/jpeg", 0.95),
        "JPEG",
        margin,
        margin,
        contentWidth,
        imageHeight
      );

      sourceY += sliceHeight;
      pageNumber++;
    }

    const name = document.getElementById("name").value.trim();
    const safeName = (name || "學徒").replace(/[\\/:*?"<>|]/g, "_");

    // 先建立 PDF 檔案，再提供連結讓使用者主動開啟或下載。
const pdfBlob = pdf.output("blob");
const pdfUrl = URL.createObjectURL(pdfBlob);

// 移除之前產生的連結，並釋放舊檔案網址。
const previous = document.getElementById("pdf-result");

if (previous) {
  if (previous.dataset.pdfUrl) {
    URL.revokeObjectURL(previous.dataset.pdfUrl);
  }
  previous.remove();
}

const result = document.createElement("div");
result.id = "pdf-result";
result.dataset.pdfUrl = pdfUrl;
result.style.cssText = [
  "margin-top: 16px",
  "padding: 16px",
  "background: #ffffff",
  "border-radius: 8px",
  "line-height: 1.8"
].join(";");

const message = document.createElement("p");
message.textContent = "PDF 已產生。請按下方連結開啟或下載：";

const openLink = document.createElement("a");
openLink.href = pdfUrl;
openLink.target = "_blank";
openLink.rel = "noopener";
openLink.textContent = "開啟 PDF";
openLink.style.cssText = [
  "display: inline-block",
  "margin-right: 16px",
  "color: #1d4ed8",
  "font-weight: bold"
].join(";");

const downloadLink = document.createElement("a");
downloadLink.href = pdfUrl;
downloadLink.download = safeName + "_履歷.pdf";
downloadLink.textContent = "下載 PDF 檔案";
downloadLink.style.cssText = [
  "display: inline-block",
  "color: #1d4ed8",
  "font-weight: bold"
].join(";");

const hint = document.createElement("p");
hint.style.fontSize = "14px";
hint.textContent =
  "iPhone：開啟 PDF 後，可按分享按鈕，選擇「儲存至檔案」。";

result.append(message, openLink, downloadLink, hint);
button.insertAdjacentElement("afterend", result);
  } catch (error) {
    console.error("產生 PDF 失敗：", error);
    alert("產生 PDF 時出現問題：" + error.message);
  } finally {
    if (stage) stage.remove();
    button.disabled = false;
    button.textContent = originalText;
  }
});

    // 使用瀏覽器選單列印時，也更新履歷內容。
    window.addEventListener("beforeprint", buildPrintView);

    // 每個類別預設顯示一項，也可以全部刪除。
    addItem("education");
    addItem("work");
    addItem("skill");
